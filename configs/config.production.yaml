# Production-oriented MCP over MOQT transport configuration.
# Copy and adjust paths before deploying.

addr: "0.0.0.0:8080"
alpn:
  - "moq-00"
enable_datagrams: true

metrics_addr: "127.0.0.1:9090"

tls:
  cert_file: "/etc/mcp-moqt/server.crt"
  key_file: "/etc/mcp-moqt/server.key"
  # Client-only: ca_file + insecure_skip_verify: false
  ca_file: ""
  insecure_skip_verify: false
