server:
  addr: "127.0.0.1:8080"
  alpn:
    - "moq-00"
  tls:
    cert_file: ""
    key_file: ""
    insecure_skip_verify: false
  quic:
    handshake_timeout: "10s"
    max_idle_timeout: "30s"
    max_stream_timeout: "5s"

client:
  addr: "127.0.0.1:8080"
  alpn:
    - "moq-00"
  tls:
    insecure_skip_verify: true
  quic:
    handshake_timeout: "10s"
    max_idle_timeout: "30s"
    max_stream_timeout: "5s"

logging:
  level: "info"
  format: "text"

# Prometheus /metrics HTTP (optional)
metrics_addr: "127.0.0.1:9090"
